name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (Home Assistant 2026.8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-test.txt

      - name: Verify Home Assistant test environment
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import hass_frontend
          import homeassistant

          expected = {
              "homeassistant": "2026.8.2",
              "home-assistant-frontend": "20260729.7",
              "pytest-homeassistant-custom-component": "0.13.356",
          }
          actual = {package: version(package) for package in expected}

          for package, expected_version in expected.items():
              actual_version = actual[package]
              if actual_version != expected_version:
                  raise SystemExit(
                      f"{package}: expected {expected_version}, got {actual_version}"
                  )

          print(f"Home Assistant: {actual['homeassistant']}")
          print(f"Home Assistant frontend: {actual['home-assistant-frontend']}")
          print(
              "pytest-homeassistant-custom-component: "
              f"{actual['pytest-homeassistant-custom-component']}"
          )
          print(f"hass_frontend module: {hass_frontend.__file__}")
          print(f"homeassistant module: {homeassistant.__file__}")
          PY

      - name: Run tests
        run: python -m pytest -q
