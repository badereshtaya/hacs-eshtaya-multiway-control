name: Bug report
description: Report a reproducible problem in Eshtaya Multi-Way Control
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 3.3.1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, addresses, personal data and other sensitive information.
      render: text
